version: 1
monarch: the-monarch
targets:
  - the-monarch/*
  - some-org/site
approval:
  plan: always
limits:
  max_turns: 40
  run_timeout_minutes: 30
  max_fix_rounds: 0
  max_concurrent_soldiers: 2
  max_runs_per_day: 10
  max_file_size_mb: 2
ci:
  wait_minutes_in_job: 10
  max_wait_minutes: 60
  log_excerpt_lines: 100
sentinel:
  interval_minutes: 5
roles:
  marshal: { model: opus }
  soldier: { model: sonnet }
  knight: { model: opus }
  scout: { enabled: true, model: claude-sonnet-5-5 }
git:
  author: "Army Bot <army@example.com>"
pr:
  draft: true
  link_realm: true
timezone: Europe/Berlin
